<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="deco" id="deco" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="logo logo-sm" data-logo></div>
    <p class="kicker">Ministerio del Campus Público · Graduación 2026</p>

    <!-- Sin ?g=: carta conjunta de los cinco · Con ?g=amanda | ana | jose | caleb | susan: la de esa persona -->
    <section class="carta" id="carta" hidden>
      <h1 class="title">Una carta para <span class="year">ustedes</span></h1>
      <p class="who" id="who"></p>
      <div class="scene">
        <div class="card" id="card">
          <div class="face front"><div class="letter" id="letter"></div></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
      <div class="tools">
        <button class="btn" id="open" type="button" hidden>Abrir la invitación</button>
      </div>
    </section>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="app.js"></script>
</body>
