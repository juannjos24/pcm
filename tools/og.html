<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Vista previa (og:image) · Graduación 2026 PCM</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Lienzo fijo de 1200×630: tools/build.js lo captura con Chrome headless.
       Ábrelo en el navegador con ?g=amanda o ?g=ana para ver cada vista previa. */
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; z-index: 1; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 380px; align-items: center; padding: 0 70px 0 80px; }
    .txt { display: grid; gap: 4px; justify-items: start; text-align: left; }
    .txt .logo { width: 64px; margin: 0 0 4px; }
    .txt .kicker { font-size: 15px; }
    .txt .title { font-size: 72px; line-height: 1; }
    .txt .sub { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 26px; color: var(--muted); }
    .txt .name { margin: 8px 0 0; font-family: var(--font-script); font-size: 60px; line-height: 1.05; white-space: nowrap; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 20px; }
    .txt .name.two { font-size: 42px; }
    /* Genérica con más de dos: todo un poco más compacto para caber en 630 px */
    .many .txt { gap: 2px; }
    .many .txt .logo { width: 54px; }
    .many .txt .title { font-size: 58px; }
    .many .txt .sub { font-size: 22px; }
    .many .txt .name { font-size: 25px; line-height: 1.12; margin-top: 4px; }
    .many .txt .career { font-size: 12px; letter-spacing: .12em; max-width: 640px; }
    .many .txt .date { margin-top: 8px; padding: 9px 18px; font-size: 17px; }
    .many .txt .date b { font-size: 21px; }
    .txt .career { margin: 0; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .txt .date { margin: 12px 0 0; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-weight: 600; font-size: 19px; }
    .txt .date b { font-family: var(--font-body); font-weight: 700; font-size: 24px; line-height: 1; }
    .art { position: relative; display: grid; place-items: center; height: 100%; }
    .art .ring { position: absolute; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--acc-rgb), .35), transparent 70%); }
    .art .ico { width: 250px; color: var(--acc); filter: drop-shadow(0 20px 50px rgba(var(--acc-rgb), .55)); }
    .art .ico.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 300px; }
    .art .ico.two span:first-child { color: #47c0f0; }
    .art .ico.two span:last-child { color: #e0486d; }
    .art .ico.many { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 300px; }
    .art .ico.many span[data-tema="mundo"] { color: #47c0f0; }
    .art .ico.many span[data-tema="sonrisa"] { color: #e0486d; }
    .art .ico.many span[data-tema="servicio"] { color: #3ec98f; }
    .art .ico.many span[data-tema="logro"] { color: #e3b84f; }
    .art .ico.many span:nth-child(3) { grid-column: 1 / -1; width: 50%; justify-self: center; }
    .cta { position: absolute; left: 80px; bottom: 26px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .deco .big { display: none; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="deco" id="deco" aria-hidden="true"></div>
  <div class="og">
    <div class="txt">
      <img class="logo" src="../src/img/PCM.svg" alt="">
      <p class="kicker">Ministerio del Campus Público · Programa de Gratitud</p>
      <h1 class="title">Graduación <span class="year">2026</span></h1>
      <p class="sub" id="sub">Una carta para ustedes</p>
      <p class="name" id="name"></p>
      <p class="career" id="career"></p>
      <p class="date"><b id="dia"></b><span id="fecha"></span></p>
    </div>
    <div class="art"><div class="ring"></div><div class="ico" id="ico"></div></div>
    <p class="cta">Toca para leer la carta ✉</p>
  </div>
  <script>window.ROOT = '../';</script>
  <script src="../assets/js/common.js"></script>
  <script>
    $('#dia').textContent = EVENT.diaNumero;
    $('#fecha').textContent = `${EVENT.mesTexto} ${EVENT.fechaISO.slice(0, 4)} · ${EVENT.diaSemana}`;
    if (GRAD) {
      document.body.dataset.tema = GRAD.tema.id;
      $('#name').textContent = GRAD.nombre;
      $('#career').textContent = GRAD.carrera;
      $('#ico').innerHTML = ICONS[GRAD.tema.icono];
      $('#sub').textContent = `${GRAD.corto} escribió una carta para ustedes`;
    } else {
      const temas = [...new Map(GRADUADAS.map((g) => [g.tema.id, g.tema])).values()];
      if (GRADUADAS.length > 2) document.body.classList.add('many');
      $('#name').className = 'name two';
      $('#name').innerHTML = GRADUADAS.map((g) => g.nombre).join('<br>');
      $('#career').textContent = [...new Set(GRADUADAS.map((g) => g.carrera).filter(Boolean))].join(' · ');
      $('#ico').className = GRADUADAS.length > 2 ? 'ico many' : 'ico two';
      $('#ico').innerHTML = temas.map((t) => `<span data-tema="${t.id}">${ICONS[t.icono]}</span>`).join('');
    }
  </script>
</body>
</html>
